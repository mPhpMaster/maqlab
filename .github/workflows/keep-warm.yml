name: Keep the game warm

# Render spins a free web service down after 15 minutes without inbound
# traffic. Waking it measured 22.8 seconds against 0.8 seconds warm, and that
# wait lands entirely on whoever opens the game first, who has no way to tell
# it from a broken link. Any request resets the idle timer, so this just knocks
# on the door periodically.
#
# Free in both directions: this repository is public, so Actions minutes are
# unmetered, and /health does no database work — it reports counters already
# in memory.
#
# WHY NOT AROUND THE CLOCK: Render grants 750 free instance hours per month
# and a 31-day month of never sleeping is 744 of them. That fits, but only if
# this is the only free service in the workspace and nothing else ever runs.
# The window below is about 465 hours a month, which leaves real headroom and
# still covers every hour anyone would actually open the game.
#
# TO CHANGE THE HOURS: edit the cron below. It is UTC, and Riyadh is UTC+3, so
# `9-23` means 12:00 until 03:00 the next day, local. `0-23` is always on.
#
# TO TURN IT OFF: Actions tab -> Keep the game warm -> ... -> Disable workflow.
#
# GitHub disables scheduled workflows in a repository that has had no commits
# for 60 days, so if the game ever goes quiet for two months this stops with
# it and has to be re-enabled by hand.

on:
  schedule:
    - cron: '*/10 9-23 * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Knock until the next run is due
        env:
          URL: https://maqlab.onrender.com/health
        run: |
          # GitHub's scheduler runs late under load — often by several minutes,
          # sometimes by more than ten. One ping per run would leave gaps wider
          # than Render's 15-minute idle timeout exactly when the queue is
          # busy, so each run covers its own slot and overlaps the next.
          ok=0
          for i in 1 2 3 4; do
            # curl already prints 000 when it cannot connect; `|| true` is
            # only here so a failed ping does not abort the whole step.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || true)
            echo "$(date -u '+%H:%M:%S') UTC  ping $i  ->  $code"
            if [ "$code" = "200" ]; then ok=$((ok + 1)); fi
            if [ "$i" -lt 4 ]; then sleep 200; fi
          done
          echo "$ok of 4 pings answered"
          # A single failure is just a cold start finishing slowly, or Render
          # restarting. Four in a row means the site is actually down, which is
          # worth a red tick rather than a silent pass.
          if [ "$ok" -eq 0 ]; then
            echo "::error::No ping answered - the game looks down."
            exit 1
          fi
