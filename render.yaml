services:
  - type: web
    name: maqlab
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Neon's free tier is permanent, unlike Render's 30-day free Postgres.
      # Paste the connection string from the Neon dashboard.
      - key: DATABASE_URL
        sync: false
      # Generated by Render on first deploy and never shown to anyone.
      - key: SESSION_SECRET
        generateValue: true
      # A Discord user id is public, not a secret.
      - key: ADMIN_IDS
        value: "272783807340609546"
      # The only two you fill in yourself, in the dashboard.
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
