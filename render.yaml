databases:
  - name: maqlab-db
    plan: free
    databaseName: maqlab
    user: maqlab

services:
  - type: web
    name: maqlab
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Render injects the connection string itself — nobody copies a password.
      - key: DATABASE_URL
        fromDatabase:
          name: maqlab-db
          property: connectionString
      # Generated by Render on first deploy and never shown to anyone.
      - key: SESSION_SECRET
        generateValue: true
      # A Discord user id is public, not a secret.
      - key: ADMIN_IDS
        value: "272783807340609546"
      # The only two you fill in yourself, in the dashboard.
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
